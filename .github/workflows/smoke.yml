name: Smoke (live CDNs)

# Hits every built-in provider's CDN URL with a real fetch and asserts
# the response carries the CORS header the runtime probe relies on. This
# is the only check that catches a CDN silently dropping CORS support
# or rotating a path — unit tests mock fetch and can't see it.
#
# Failures here mean every customer using that provider would suddenly
# see "blocked" for users who aren't actually blocked. Treat as a Sev-2.

on:
  schedule:
    # Daily at 13:00 UTC. Late enough that overnight CDN rollouts have
    # stabilised, early enough to land before European business hours.
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/nub
          key: nub-node24-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: nub --no-env-file install --frozen-lockfile
      - name: Run live-CDN smoke probe
        run: cd packages/core && nub --no-env-file run test:smoke
