name: Publish blockrate-server

# Trigger on tags of the form v<semver>, e.g. v0.2.0. Both blockrate and
# blockrate-server are released in lockstep from the same tag — this
# workflow and the sibling publish workflow both listen for v* and run
# in parallel. package.json on the two packages MUST stay in sync; the
# tag-version check below fails the publish if this package is out of
# sync with the tag.
on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # environment: release  # uncomment if the trusted publisher is scoped
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile

      # Verify the tag matches packages/server/package.json. `GITHUB_REF_NAME`
      # is injected by Actions as the tag string; using the env var instead of
      # inlining `${{ github.ref_name }}` keeps run blocks safe from any
      # would-be script-injection payload in a tag name.
      - name: Verify tag matches package.json
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p "require('./packages/server/package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag version $tag_version does not match packages/server/package.json version $pkg_version"
            exit 1
          fi
          echo "Publishing blockrate-server@$pkg_version"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm (trusted publisher + provenance)
        working-directory: packages/server
        run: npm publish --provenance --access public
