name: Publish

# Trigger on tags of the form v<semver>, e.g. v0.2.0. blockrate and
# blockrate-server are released in lockstep from the same tag, one matrix
# entry each. package.json on the two packages MUST stay in sync; the
# tag-version check below fails an entry's publish if its package is out of
# sync with the tag.
on:
  push:
    tags:
      - "v*"

# `id-token: write` lets the runner mint the OIDC token npm uses for trusted
# publishing. `contents: read` is the default for checkout. `attestations:
# write` is needed to write the provenance attestation via Sigstore.
permissions:
  id-token: write
  contents: read
  attestations: write

jobs:
  publish:
    name: Publish ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The environment name below must match the environment you configure on
    # each package's trusted publisher entry on npmjs.com (Settings →
    # Publishing access → GitHub Actions). Leave it commented if you did not
    # scope the trusted publisher to an environment.
    # environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: blockrate
            dir: core
          - package: blockrate-server
            dir: server
    env:
      PACKAGE_NAME: ${{ matrix.package }}
      PACKAGE_DIR: packages/${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile

      # Verify the tag matches the package's package.json. `GITHUB_REF_NAME`
      # is injected by Actions as the tag string; git's refname rules keep
      # shell metacharacters out of it, so the bash parameter expansion
      # below is safe. Never inline `${{ github.ref_name }}` into a run
      # block; this is the recommended pattern to avoid script injection.
      - name: Verify tag matches package.json
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p "require('./$PACKAGE_DIR/package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag version $tag_version does not match $PACKAGE_DIR/package.json version $pkg_version"
            exit 1
          fi
          echo "Publishing $PACKAGE_NAME@$pkg_version"

      - name: Build
        if: matrix.dir == 'core'
        working-directory: packages/core
        run: bun run build

      # Node is only needed for `npm publish`; Bun handled everything up
      # to this point. setup-node also writes an .npmrc pointed at the
      # public registry, which npm publish needs to pick the right endpoint.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm (trusted publisher + provenance)
        working-directory: ${{ env.PACKAGE_DIR }}
        # `--provenance` produces a Sigstore attestation. `--access public`
        # is required on first publish for unscoped packages; harmless on
        # subsequent publishes.
        run: npm publish --provenance --access public
