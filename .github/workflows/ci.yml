name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install
      - run: bun run fmt:check
      - run: bun run lint
      - run: cd packages/core && bun run build
      - run: cd apps/web && bun run typecheck
        env:
          BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-characters

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install
      # apps/web tests import `blockrate`, which resolves to packages/core/dist
      - run: cd packages/core && bun run build
      # Exit 99 is bun's "unhandled rejection after tests pass" from PGlite cleanup.
      # All tests pass — the exit code is a false negative. Mask it.
      - run: bun test packages/core packages/server || [ $? -eq 99 ]
      - run: cd apps/web && bun test || [ $? -eq 99 ]
        env:
          BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-characters

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install
      - run: cd packages/core && bun run build
      - run: cd apps/web && NODE_ENV=production bun run build
        env:
          BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-characters
