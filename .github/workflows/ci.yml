name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "packages/*/README.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/nub
          key: nub-node24-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: nub --no-env-file install --frozen-lockfile
      - run: nub --no-env-file run format:check
      - run: nub --no-env-file run lint
      - run: nub --no-env-file run build:packages
      - run: nub --no-env-file run typecheck
        env:
          BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-characters
          DATABASE_URL: pglite://

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/nub
          key: nub-node24-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: nub --no-env-file install --frozen-lockfile
      # apps/web tests import `blockrate`, which resolves to packages/core/dist
      - run: nub --no-env-file run build:packages
      - run: nub --no-env-file run test
      - run: nub --no-env-file run test:package
        env:
          BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-characters
          DATABASE_URL: pglite://

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/nub
          key: nub-node24-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: nub --no-env-file install --frozen-lockfile
      - run: nub --no-env-file run build:packages
      - run: cd apps/web && NODE_ENV=production nub --no-env-file run build
        env:
          BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-characters
          DATABASE_URL: pglite://
      - run: cd apps/web && nub --no-env-file run test:headers
